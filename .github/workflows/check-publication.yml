name: Check map publication

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "_config.yml"
      - "scripts/check_publication.py"
      - "scripts/build_sitemap.py"
      - ".github/workflows/check-publication.yml"
  pull_request:

concurrency:
  group: publication-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate gallery, sitemap, metadata, and local links
        run: python3 scripts/check_publication.py
      - name: Verify validation did not modify the checkout
        run: git diff --exit-code
