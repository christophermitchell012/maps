name: Check map publication

on:
  push:
    branches: [main, 'release-*', 'git-tree-e2e-*']
    paths:
      - "*.html"
      - "data/maps.json"
      - "sitemap.xml"
      - "robots.txt"
      - "_config.yml"
      - "scripts/check_publication.py"
      - "scripts/build_sitemap.py"
      - "scripts/generate_index.py"
  pull_request:

concurrency:
  group: publication-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate derived publication files on release branches
        if: startsWith(github.ref, 'refs/heads/release-')
        run: |
          python3 scripts/generate_index.py
          python3 scripts/build_sitemap.py
          git diff --check
      - name: Commit generated files on release branches
        if: startsWith(github.ref, 'refs/heads/release-')
        run: |
          if git diff --quiet -- index.html sitemap.xml; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html sitemap.xml
          git commit -m 'Generate publication files'
          git push
      - name: Validate gallery, sitemap, metadata, and local links
        run: python3 scripts/check_publication.py
