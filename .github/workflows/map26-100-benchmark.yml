name: Map 26 100-location Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/map26-100-benchmark.yml"
      - "scripts/map26_100_benchmark.py"
      - "scripts/map26_darksky_prototype.py"
      - "prototypes/map26-100-benchmark.html"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore NASA tile cache
        uses: actions/cache@v4
        with:
          path: .cache/map26-vnp46a4
          key: map26-vnp46a4-2024-${{ runner.os }}-v1
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests h5py
      - name: Verify Earthdata secret
        shell: bash
        run: |
          test -n "$EARTHDATA_TOKEN" || { echo "::error::EARTHDATA_TOKEN is missing"; exit 1; }
      - name: Python 100-location benchmark and snapshot build
        run: python scripts/map26_100_benchmark.py
      - name: Find Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "::error::Chrome/Chromium not found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts puppeteer-core
      - name: Start local static server
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/map26-http.log 2>&1 &
          echo $! > /tmp/map26-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/data/map26-100-prototype.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/map26-http.log
          exit 1
      - name: JavaScript browser benchmark
        run: node scripts/map26_browser_benchmark.mjs
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: map26-100-benchmark
          path: |
            artifacts/map26-100-python-benchmark.json
            artifacts/map26-browser-benchmark.json
            data/map26-100-prototype.json
          retention-days: 14
      - name: Publish prototype snapshot JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map26-100-prototype.json data/map26-100-nws-grid-map.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
          else
            git commit -m "Update Map 26 100-location prototype snapshot"
            git push
          fi
