name: One-time SVG resource migration
on:
  push:
    branches: [svg-resource-migration]
    paths: ['scripts/externalize_svg_assets.py', '.github/workflows/svg-resource-migration.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure before
        run: wc -c index.html
      - name: Externalize SVG resources
        run: python3 scripts/externalize_svg_assets.py
      - name: Verify migration output
        run: |
          if grep -RIl 'data:image/svg+xml' --include='*.html' . | grep .; then echo 'embedded SVG data URI remains'; exit 1; fi
          git diff --check
          test -n "$(find assets/icons -type f -name '*.svg' -print -quit)"
          echo 'index bytes after:'
          wc -c index.html
      - name: Commit migration on candidate branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -- '*.html' assets/icons
          git commit -m 'Externalize SVG icons and favicons' || exit 0
          git push
