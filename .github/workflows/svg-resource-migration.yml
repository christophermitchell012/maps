name: One-time SVG resource migration
on:
  push:
    branches: [svg-resource-migration]
    paths: ['scripts/externalize_svg_assets.py', '.github/workflows/svg-resource-migration.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure before
        run: |
          wc -c index.html
          grep -RIl 'data:image/svg+xml' --include='*.html' . | sort || true
      - name: Externalize SVG resources
        run: python3 scripts/externalize_svg_assets.py
      - name: Verify no embedded SVGs outside scripts
        run: |
          if grep -RIl 'data:image/svg+xml' --include='*.html' . | grep .; then exit 1; fi
          python3 scripts/check_publication.py
          git diff --check
          echo 'index bytes after:'
          wc -c index.html
      - name: Commit migration on candidate branch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -- '*.html' assets/icons scripts/externalize_svg_assets.py
          git commit -m 'Externalize SVG icons and favicons' || exit 0
          git push
# trigger after default-branch registration
