name: Map 26 Tonight Rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/map26-tonight.yml"
      - "scripts/map26_production_build.py"
      - "scripts/map26_darksky_prototype.py"
      - "scripts/map26_production_smoke.mjs"
      - "26-dark-sky-tonight.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check requests h5py ephem
      - name: Verify Earthdata secret
        shell: bash
        run: |
          test -n "$EARTHDATA_TOKEN" || { echo "::error::EARTHDATA_TOKEN is missing"; exit 1; }
      - name: Build 100-place tonight snapshot
        run: python scripts/map26_production_build.py
      - name: Find Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "::error::Chrome/Chromium not found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts puppeteer-core
      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/map26-prod-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/data/map26-tonight.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/map26-prod-http.log
          exit 1
      - name: Browser smoke/performance test
        run: node scripts/map26_production_smoke.mjs
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: map26-tonight-diagnostics
          path: |
            artifacts/map26-production-build.json
            artifacts/map26-production-browser-smoke.json
            data/map26-tonight.json
          retention-days: 14
      - name: Publish refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map26-candidate-places.json data/map26-radiance-baseline.json data/map26-nws-grid-map.json data/map26-tonight.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Map 26 tonight rankings"
            git push
          fi
