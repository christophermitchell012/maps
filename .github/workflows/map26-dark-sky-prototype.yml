name: Map 26 Dark Sky Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-location-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies
        run: python -m pip install --disable-pip-version-check requests h5py
      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN repository secret is not configured"
            exit 1
          fi
      - name: Verify NASA EDL token against LAADS
        shell: bash
        run: |
          curl --fail --silent --show-error --location --cookie session \
            -H "Authorization: Bearer $EARTHDATA_TOKEN" \
            "https://ladsweb.modaps.eosdis.nasa.gov/archive/README" \
            -o /tmp/laads-readme
          test -s /tmp/laads-readme
          if grep -qi "<html" /tmp/laads-readme; then
            echo "::error::NASA returned HTML instead of archive content"
            exit 1
          fi
      - name: Probe real VNP46A4 file
        shell: bash
        run: |
          curl --fail --silent --show-error --location --cookie session \
            -H "Authorization: Bearer $EARTHDATA_TOKEN" \
            --range 0-31 \
            -w "HTTP=%{http_code} TYPE=%{content_type} BYTES=%{size_download} FINAL=%{url_effective}\n" \
            "https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VNP46A4/2024/001/VNP46A4.A2024001.h08v05.002.2025161223601.h5" \
            -o /tmp/vnp46-probe
          echo -n "MAGIC="
          xxd -p -l 8 /tmp/vnp46-probe
          file /tmp/vnp46-probe
      - name: Run Austin, Big Bend, NYC test
        run: python scripts/map26_darksky_prototype.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map26-three-location-test
          path: artifacts/map26-three-location-test.json
          if-no-files-found: warn
          retention-days: 7
