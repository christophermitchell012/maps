name: One-time Map 28 index patch
on:
  push:
    paths:
      - .github/workflows/patch-map28-index.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='Explore 28 interactive maps that turn public data into practical geographic views'
          new='Explore 29 interactive maps that turn public data into practical geographic views'
          assert s.count(old)==1, 'unexpected map-count text'
          s=s.replace(old,new,1)
          anchor='</nav></section>\n<section class="panel"><h2>Explore by theme</h2>'
          assert s.count(anchor)==1, 'unexpected gallery closing anchor'
          icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ffd45d' stroke-width='2.4'/%3E%3Cpath d='M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M25.9 6.1l-3.5 3.5M9.6 22.4l-3.5 3.5' fill='none' stroke='%23ffd45d' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M4 23c6-4 18-4 24 0' fill='none' stroke='%2372d5ff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
          row=f'<a class="maprow" data-map="28" href="28-daylight-explorer.html"><span class="num">28</span><span class="maptext"><span class="name"><img class="map-icon" src="{icon}" alt="" aria-hidden="true">Daylight Explorer</span><span class="desc">Explore the subsolar point, day/night terminator, sunrise, sunset, twilight and solar geometry anywhere on Earth.</span></span><span class="tag">Space</span></a>\n'
          s=s.replace(anchor,row+anchor,1)
          space_end='</div><div class="group news"><h3>News &amp; current events</h3>'
          assert s.count(space_end)==1, 'unexpected space-group closing anchor'
          theme=f'<a data-map="28" href="28-daylight-explorer.html"><span>28</span><img class="map-icon" src="{icon}" alt="" aria-hidden="true">Daylight Explorer</a>'
          s=s.replace(space_end,theme+space_end,1)
          p.write_text(s)
          PY
      - name: Validate publication
        run: python3 scripts/check_publication.py
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-map28-index.yml
          git add index.html
          git commit -m "Add Map 28 to collection index"
          git push
